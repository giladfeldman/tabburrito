<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Bar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: #16162a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      color: #ccc;
      overflow: hidden;
      border-bottom: 1px solid #2a2a3e;
    }
    #url-input {
      flex: 1;
      height: 24px;
      background: #1e1e3a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ddd;
      padding: 0 8px;
      font-size: 12px;
      font-family: 'Consolas', monospace;
      outline: none;
    }
    #url-input:focus { border-color: #4a6cf7; }
    .bar-btn {
      width: 24px; height: 24px;
      background: none; border: none; cursor: pointer;
      color: #888; display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      font-size: 14px;
    }
    .bar-btn:hover { background: #2a2a4a; color: #ddd; }
    .bar-btn.active { color: #22c55e; }
    #zoom-label { font-size: 11px; color: #888; min-width: 35px; text-align: center; }
    #svc-label { font-size: 11px; color: #4a6cf7; font-weight: 600; min-width: 60px; }
    #adblock-indicator { font-size: 10px; color: #22c55e; display: none; cursor: pointer; }
    #adblock-indicator.visible { display: inline; }
    #adblock-indicator.disabled { color: #666; }
  </style>
</head>
<body>
  <span id="svc-label">...</span>
  <input id="url-input" type="text" placeholder="URL..." />
  <button class="bar-btn" id="btn-go" title="Navigate">&#x2192;</button>
  <button class="bar-btn" id="btn-zout" title="Zoom Out (Ctrl+-)">&#x2212;</button>
  <span id="zoom-label">100%</span>
  <button class="bar-btn" id="btn-zin" title="Zoom In (Ctrl+=)">+</button>
  <span id="adblock-indicator" title="Click to toggle LinkedIn ad blocker">&#x1F6E1; AdBlock</span>
  <script src="urlbar.js"></script>
</body>
</html>
