# App-local permission for the paste-image native fetch.
#
# Tauri resolves app command permissions from files in this directory; a bare
# name in a capability is not enough (build fails with "Permission ... not
# found"). Verified 2026-08-05.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-fetch-image-as-data-uri"
description = """
Allows fetching a single https image URL natively and returning it as a data
URI. Needed because copying an image in a browser puts only a URL on the
clipboard, and image CDNs commonly serve no Access-Control-Allow-Origin
header, so the page cannot read the bytes itself. The command sends no
cookies, accepts only https, requires an image content-type, and is size
capped.
"""
commands.allow = ["fetch_image_as_data_uri"]
