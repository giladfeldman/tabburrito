[package]
name = "tabburrito"
version = "0.1.0"
description = "Lightweight multi-service web app dock"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Native image fetch for paste-from-another-site. Cannot be done in the page:
# CDNs like Bluesky's send no Access-Control-Allow-Origin, so a page-context
# fetch is blocked by CORS. Already in the tree via Tauri; pinned explicitly
# because we now depend on it directly. rustls avoids an OpenSSL build dep.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [] }
